name: Build Mod from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Unzip source code
        run: |
          mkdir -p source
          unzip -o *.zip -d source
          BUILD_FILE=$(find source -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          chmod +x "$PROJECT_DIR/gradlew" || true

      - name: Build with Gradle
        run: |
          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mod
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            
