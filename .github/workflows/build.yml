name: Build Mod from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip source archive
        run: |
          unzip -o jumpenchant-mod.zip -d extracted/
          GRADLE_PATH=$(find extracted -name "build.gradle" -exec dirname {} \;)
          echo "Found build.gradle at: $GRADLE_PATH"
          cp -r $GRADLE_PATH/* .

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build with Gradle
        run: gradle build --no-daemon

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mod
          path: build/libs/*.jar
          
